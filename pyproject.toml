[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkmesh"
version = "0.2.0"
description = "Tokamak R-Z triangular mesh generation for TRIMEG and M3D-C1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "openfusiontoolkit==26.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
trimeg = ["h5py>=3.8"]
all = ["matplotlib>=3.7", "h5py>=3.8"]
dev = ["pytest>=7"]

[project.scripts]
linkmesh = "linkmesh.cli:main"
linkmesh-check = "linkmesh.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
